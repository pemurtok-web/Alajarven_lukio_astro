[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  PUBLIC_SANITY_PROJECT_ID = "8idyoy2x"
  PUBLIC_SANITY_DATASET = "production"

# SPA redirect for embedded Sanity Studio (/studio)
[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200

# Prevent search engine indexing on Netlify (Noindex)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

